<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShortsPilot AI</title>
<style>body{background:#0d1522;color:#ebf2ff;font:15px system-ui;margin:0}main{max-width:1100px;margin:35px auto;padding:0 18px}h1{margin-bottom:4px}p,small{color:#a6bad2}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,textarea,button,select{font:inherit;padding:9px;border-radius:8px}input,textarea,select{background:#1b283b;color:#eef4ff;border:1px solid #41516b}input{max-width:250px}textarea{display:block;width:95%;min-height:75px;margin:6px 0 12px}button{background:#34c8b5;color:#06201e;border:0;cursor:pointer;font-weight:600}button.secondary{background:#263c57;color:#eaf1ff}article{border:1px solid #374860;border-radius:13px;padding:18px;margin:16px 0;background:#121e30}.tag{display:inline-block;border:1px solid #4d6179;border-radius:99px;padding:3px 10px;margin:3px;color:#b5d1ed}a{color:#9dd8f9}.status{color:#68deca}#msg{white-space:pre-wrap}.head{display:flex;justify-content:space-between;gap:14px;align-items:center}.actions{display:flex;flex-wrap:wrap;gap:5px}</style></head>
<body><main><h1>ShortsPilot AI <small>v0.2</small></h1><p>Hinglish • 3 Shorts/day target • India + globally relevant trends • mandatory human approval</p>
<div class="bar"><input id="token" type="password" placeholder="Local admin token"><button onclick="ingest()">Fetch trends</button><button class="secondary" onclick="load()">Refresh</button><select id="category" onchange="load()"><option value="">All categories</option><option value="tech">Technology</option><option value="india">India</option><option value="global">Global</option></select></div>
<p id="msg"></p><div id="topics"></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=()=>document.getElementById('token').value;
async function api(path,method='GET',body=null){const r=await fetch(path,{method,headers:{'X-Admin-Token':token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const value=await r.json();if(!r.ok)throw Error(value.detail||JSON.stringify(value));return value}
async function action(fn){try{await fn();await load()}catch(e){document.getElementById('msg').textContent='Error: '+e.message}}
async function ingest(){await action(async()=>{const r=await api('/api/trends/fetch','POST');document.getElementById('msg').textContent=`New: ${r.added} / Candidates: ${r.candidates} / Errors: ${JSON.stringify(r.errors)}`})}
async function save(id,withScript){await api('/api/topics/'+id,'PATCH',{editor_notes:document.getElementById('notes_'+id).value,...(withScript?{script:document.getElementById('script_'+id).value}:{})})}
async function draft(id){await action(async()=>{await save(id,false);await api('/api/topics/'+id+'/draft','POST')})}
async function render(id,voice){await action(async()=>{await save(id,true);await api('/api/topics/'+id+'/render?voice_enabled='+voice,'POST')})}
async function decision(id,which){await action(async()=>{await api('/api/topics/'+id+'/decision','POST',{action:which,actor:'owner'})})}
async function preview(id){try{const r=await fetch('/api/topics/'+id+'/video',{headers:{'X-Admin-Token':token()}});if(!r.ok)throw Error('Preview unavailable');const blob=await r.blob();const u=URL.createObjectURL(blob);const w=window.open('','_blank');if(!w){URL.revokeObjectURL(u);throw Error('Allow popup to preview')}w.document.body.innerHTML='<video controls autoplay style="max-height:92vh;max-width:98vw"></video>';w.document.querySelector('video').src=u;w.addEventListener('beforeunload',()=>URL.revokeObjectURL(u))}catch(e){alert(e.message)}}
async function load(){try{const rows=await api('/api/topics'+(document.getElementById('category').value?'?category='+document.getElementById('category').value:''));
 document.getElementById('topics').innerHTML=rows.map(t=>`<article><div class="head"><h2>${esc(t.title)}</h2><span class="status">${esc(t.status)}</span></div><div><span class="tag">${esc(t.category)}</span><span class="tag">${esc(t.region)}</span><span class="tag">Score ${t.score}</span><span class="tag">${esc(t.adapter)}</span></div><p>${t.sources.map(s=>`<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">Source link</a>`).join(' · ')}</p><label>Fact-checked editorial notes (minimum 50 characters)</label><textarea id="notes_${t.id}">${esc(t.editor_notes)}</textarea><div class="actions"><button class="secondary" onclick="action(()=>save('${t.id}',false))">Save notes</button><button onclick="draft('${t.id}')">Draft Hinglish (Ollama)</button></div><label>Editable original voice script</label><textarea id="script_${t.id}">${esc(t.script)}</textarea><div class="actions"><button class="secondary" onclick="action(()=>save('${t.id}',true))">Save draft</button><button onclick="render('${t.id}',true)">Render + voice</button><button class="secondary" onclick="render('${t.id}',false)">Silent preview</button><button class="secondary" onclick="preview('${t.id}')">Preview MP4</button></div><div class="actions"><button onclick="decision('${t.id}','approve')">Approve narrated video</button><button class="secondary" onclick="decision('${t.id}','queue')">Queue approved</button><button class="secondary" onclick="decision('${t.id}','reject')">Reject</button><button class="secondary" onclick="decision('${t.id}','revise')">Revise</button></div></article>`).join('') || '<p>No topics. Fetch trends or try again later.</p>';
 }catch(e){document.getElementById('msg').textContent=e.message}}
</script></body></html>
